<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    @keyframes sa-pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: 1; transform: scale(1.35) } }
    @keyframes sa-rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    @keyframes sa-ring-admin { 0% { box-shadow: 0 0 0 0 rgba(240,160,60,.5) } 100% { box-shadow: 0 0 0 16px rgba(240,160,60,0) } }
    @keyframes sa-ring-counter { 0% { box-shadow: 0 0 0 0 rgba(200,162,74,.45) } 100% { box-shadow: 0 0 0 16px rgba(200,162,74,0) } }
  </style>
</helmet>

<sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
  <button onClick="{{ open }}" aria-label="Assistant" style="position: fixed; right: 18px; bottom: 18px; z-index: 400; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: {{ c.bub }}; border: 1px solid {{ c.bubEdge }}; box-shadow: 0 10px 30px rgba(0,0,0,.55)">
    <span style="width: 7px; height: 7px; border-radius: 50%; animation: sa-pulse 2.6s ease-in-out infinite; background: {{ c.acc }}"></span>
    <sc-if value="{{ unread }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; top: 10px; right: 10px; width: 6px; height: 6px; border-radius: 50%; background: {{ c.bad }}"></span>
    </sc-if>
  </button>
</sc-if>

<sc-if value="{{ shown }}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; right: 18px; bottom: 18px; z-index: 400; display: flex; flex-direction: column; width: min(380px, calc(100vw - 28px)); max-height: min(640px, calc(100dvh - 36px)); border-radius: 16px; overflow: hidden; animation: sa-rise .18s ease-out; box-shadow: 0 24px 64px rgba(0,0,0,.7); background: {{ c.panel }}; border: 1px solid {{ c.edge }}">

    <div style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid {{ c.line }}">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <div style="font-size: 8px; letter-spacing: .38em; text-transform: uppercase; color: {{ c.dim }}">{{ scopeLabel }}</div>
        <div style="font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 300; line-height: 1.1; color: {{ c.ink }}">Assistant</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <sc-if value="{{ engineShown }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 8px; letter-spacing: .2em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; color: {{ c.dim }}; border: 1px solid {{ c.edgeSoft }}">{{ engine }}</span>
        </sc-if>
        <button onClick="{{ close }}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; background: transparent; font-size: 17px; line-height: 1; cursor: pointer; border: 1px solid {{ c.edgeSoft }}; color: {{ c.mut }}">×</button>
      </div>
    </div>

    <div ref="{{ logRef }}" style="flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 15px">

      <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 2px">
          <div style="font-size: 12.5px; line-height: 1.6; text-wrap: pretty; color: {{ c.mut }}">Ask about the numbers, or hold the mic and dictate an order in Tamil or Telugu.</div>
          <div style="display: flex; flex-direction: column; gap: 7px">
            <sc-for list="{{ prompts }}" as="p" hint-placeholder-count="3">
              <button onClick="{{ p.go }}" style="text-align: left; min-height: 44px; padding: 11px; border-radius: 9px; font-size: 11.5px; line-height: 1.45; cursor: pointer; border: 1px solid {{ c.edgeSoft }}; background: {{ c.chip }}; color: {{ c.body }}">{{ p.text }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-for list="{{ log }}" as="m" hint-placeholder-count="0">
        <div style="display: flex; flex-direction: column; gap: 5px; align-items: {{ m.align }}">
          <div style="font-size: 8px; letter-spacing: .3em; text-transform: uppercase; color: {{ m.label }}">{{ m.who }}</div>
          <div style="max-width: 92%; padding: 10px 12px; border-radius: 11px; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; text-wrap: pretty; color: {{ m.ink }}; background: {{ m.bg }}; border: 1px solid {{ m.edge }}">{{ m.text }}</div>
        </div>
      </sc-for>

      <sc-if value="{{ thinking }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 7px; padding-left: 2px">
          <span style="width: 5px; height: 5px; border-radius: 50%; animation: sa-pulse 1.1s ease-in-out infinite; background: {{ c.acc }}"></span>
          <span style="font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: {{ c.dim }}">{{ thinkingLabel }}</span>
        </div>
      </sc-if>

      <sc-if value="{{ hasKot }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 11px; padding: 13px; border-radius: 12px; background: {{ c.chip }}; border: 1px solid {{ c.tintEdge }}">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px">
            <div style="font-size: 8px; letter-spacing: .3em; text-transform: uppercase; color: {{ c.dim }}">Confirm before it fires</div>
            <div style="font-size: 11px; color: {{ c.body }}">{{ kotTable }}</div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 7px">
            <sc-for list="{{ kotItems }}" as="it" hint-placeholder-count="2">
              <div style="display: flex; align-items: baseline; gap: 9px">
                <span style="flex: 0 0 auto; min-width: 22px; font-family: 'Cormorant Garamond', serif; font-size: 17px; color: {{ c.acc }}">{{ it.qty }}</span>
                <span style="flex: 1 1 auto; font-size: 12.5px; line-height: 1.4; color: {{ c.ink }}">{{ it.name }}</span>
              </div>
              <sc-if value="{{ it.hasNote }}" hint-placeholder-val="{{ false }}">
                <div style="padding-left: 31px; font-size: 10.5px; font-style: italic; color: {{ c.mut }}">{{ it.note }}</div>
              </sc-if>
            </sc-for>
          </div>
          <sc-if value="{{ kotUnmatched }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 10.5px; line-height: 1.5; padding: 8px 10px; border-radius: 7px; color: {{ c.warn }}; background: {{ c.warnBg }}">{{ kotWarn }}</div>
          </sc-if>
          <div style="display: flex; gap: 7px">
            <button onClick="{{ kotConfirm }}" style="flex: 1 1 auto; min-height: 44px; padding: 10px; border-radius: 9px; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; border: 1px solid {{ c.goEdge }}; background: {{ c.go }}; color: {{ c.goInk }}">Send to kitchen</button>
            <button onClick="{{ kotDiscard }}" style="flex: 0 0 auto; min-height: 44px; padding: 10px 15px; border-radius: 9px; background: transparent; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; border: 1px solid {{ c.edgeSoft }}; color: {{ c.mut }}">Discard</button>
          </div>
          <div style="font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: {{ c.mut }}">{{ kotBy }}</div>
        </div>
      </sc-if>

      <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 11px; line-height: 1.5; padding: 9px 11px; border-radius: 9px; color: {{ c.bad }}; background: {{ c.badBg }}; border: 1px solid {{ c.badEdge }}">{{ note }}</div>
      </sc-if>
    </div>

    <div style="flex: 0 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 11px; border-top: 1px solid {{ c.line }}">
      <button onPointerDown="{{ micDown }}" onPointerUp="{{ micUp }}" onPointerLeave="{{ micUp }}" aria-label="Hold to talk" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; border: 1px solid {{ micEdge }}; background: {{ micBg }}; animation: {{ micAnim }}">
        <span style="width: 10px; height: 14px; border-radius: 5px 5px 4px 4px; background: {{ micInk }}"></span>
      </button>
      <textarea ref="{{ inputRef }}" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" rows="1" placeholder="{{ placeholder }}" style="flex: 1 1 auto; box-sizing: border-box; resize: none; min-height: 44px; max-height: 96px; padding: 12px; border-radius: 11px; font-family: inherit; font-size: 12.5px; line-height: 1.45; outline: none; background: rgba(0,0,0,.35); border: 1px solid {{ c.fieldEdge }}; color: {{ c.ink }}"></textarea>
      <button onClick="{{ send }}" aria-label="Send" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-size: 16px; line-height: 1; cursor: pointer; border: 1px solid {{ c.tintEdge }}; background: {{ c.tint }}; color: {{ c.acc }}">↑</button>
    </div>

    <sc-if value="{{ langShown }}" hint-placeholder-val="{{ false }}">
      <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 0 11px 11px">
        <span style="font-size: 8px; letter-spacing: .26em; text-transform: uppercase; color: {{ c.mut }}">Voice</span>
        <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
          <button onClick="{{ l.go }}" style="min-height: 44px; padding: 0 13px; border-radius: 9px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; border: 1px solid {{ l.edge }}; background: {{ l.bg }}; color: {{ l.ink }}">{{ l.label }}</button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 420, &quot;height&quot;: 680 },
  &quot;scope&quot;: {
    &quot;editor&quot;: &quot;enum&quot;,
    &quot;options&quot;: [&quot;admin&quot;, &quot;counter&quot;],
    &quot;default&quot;: &quot;admin&quot;,
    &quot;tsType&quot;: &quot;'admin' | 'counter'&quot;,
    &quot;section&quot;: &quot;Placement&quot;
  },
  &quot;apiBase&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Placement&quot; },
  &quot;staff&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Placement&quot; },
  &quot;tables&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Placement&quot; },
  &quot;sb&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;SupabaseClient | null&quot; },
  &quot;rid&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot; },
  &quot;groqKey&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot; },
  &quot;geminiKey&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot; },
  &quot;onKot&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(ticket: { table: string; items: { name: string; qty: number; note?: string }[]; staff: string }) =&gt; void&quot; }
}">
// The assistant that follows staff around the admin panel and the counter.
//
// It reads the agent route's plain-text stream rather than the SDK's message
// protocol, so there is no React SDK, no bundler and no protocol parser on this
// side: fetch, read the body, append characters. The one structured thing it
// needs — a dictated order — arrives as a fenced ```kot block at the end of the
// reply, which is a regex here instead of a tool-call channel.
// ponytail: worth upgrading to the real stream protocol only if this needs to
// show tool progress live.
//
// Voice is push-to-talk, not continuous: MediaRecorder while the button is
// held, one round trip on release. Gemini hears it, the chat model answers,
// Qwen puts the answer back into the speaker's language, and the browser
// speaks it.

// The two screens this mounts on do not share a palette, and a persistent
// floating panel in the wrong gold reads as something bolted on. Counter is
// olive-gold on warm brown-grey; the guest app's admin panel is orange-amber
// on near-black. Both sets are lifted from those files rather than invented.
//
// These are holes in the template, which normally delays paint — acceptable
// here only because the widget is a collapsed bubble until someone taps it, so
// there is no first-paint content waiting on them.
const SKIN = {
  admin: {
    acc: '#f0a03c', ink: '#f2ece2', body: '#cfc4b4', mut: '#8a7f72',
    // Full-opacity, not alpha-muted: this token labels "Confirm before it
    // fires" at 8px, and the alpha version measured 3.86:1 on the panel ground.
    dim: '#bd8a3c',
    panel: 'linear-gradient(180deg, #16110c 0%, #0b0907 100%)',
    bub: 'radial-gradient(120% 120% at 30% 20%, #241a10 0%, #0f0d0a 70%)',
    bubEdge: 'rgba(240,160,60,.28)',
    edge: 'rgba(240,160,60,.18)', edgeSoft: 'rgba(240,160,60,.14)',
    line: 'rgba(240,160,60,.1)', chip: 'rgba(240,160,60,.04)',
    fieldEdge: 'rgba(240,160,60,.16)',
    tint: 'rgba(240,160,60,.1)', tintEdge: 'rgba(240,160,60,.3)',
    go: 'rgba(240,160,60,.14)', goEdge: 'rgba(240,160,60,.5)', goInk: '#f2ece2',
    ring: 'sa-ring-admin 1.4s ease-out infinite',
    warn: '#e2a04d', warnBg: 'rgba(226,160,77,.08)',
    bad: '#e2564d', badBg: 'rgba(226,86,77,.07)', badEdge: 'rgba(226,86,77,.2)',
    mine: 'rgba(240,160,60,.1)', mineEdge: 'rgba(240,160,60,.2)',
    theirs: 'rgba(255,255,255,.03)', theirsEdge: 'rgba(240,160,60,.08)',
  },
  counter: {
    acc: '#c8a24a', ink: '#efe7db', body: '#cfc6b8', mut: '#9a8f7f',
    dim: '#b59450',
    panel: 'linear-gradient(180deg, #16130f 0%, #100e0a 100%)',
    bub: 'radial-gradient(120% 120% at 30% 20%, #221c12 0%, #12100c 70%)',
    bubEdge: '#2a231b',
    edge: '#2a231b', edgeSoft: '#221d16',
    line: '#221d16', chip: 'rgba(200,162,74,.05)',
    fieldEdge: '#2a231b',
    tint: 'rgba(200,162,74,.12)', tintEdge: 'rgba(200,162,74,.3)',
    // Confirming a dictated round is a punch, so it wears the Punch button's
    // green rather than a second version of the accent.
    go: '#9dc47f', goEdge: '#9dc47f', goInk: '#10180a',
    ring: 'sa-ring-counter 1.4s ease-out infinite',
    warn: '#c8a24a', warnBg: 'rgba(200,162,74,.09)',
    bad: '#d98a6f', badBg: 'rgba(217,138,111,.08)', badEdge: 'rgba(217,138,111,.24)',
    mine: 'rgba(200,162,74,.1)', mineEdge: 'rgba(200,162,74,.22)',
    theirs: '#12100c', theirsEdge: '#221d16',
  },
};

const PHASE = {
  listening: 'Listening',
  thinking: 'Thinking',
  reading: 'Reading the numbers',
  salesSummary: 'Reading the takings',
  topDishes: 'Reading what sold',
  slowMovers: 'Reading what did not sell',
  dishRatings: 'Reading the ratings',
  kitchenBottlenecks: 'Reading the kitchen',
  sellouts: 'Reading the sell-outs',
  daypartMix: 'Reading the hours',
};

class Component extends DCLogic {
  state = {
    open: false, log: [], draft: '', busy: false, phase: '',
    kot: null, note: '', lang: 'ta', rec: false, engine: '', unread: false,
  };

  cfg() { return (typeof window !== 'undefined' && window.SULTHANS_CONFIG) || {}; }
  base() { return this.props.apiBase ?? this.cfg().agentBase ?? ''; }

  /* Two ways to run, decided by config.js and nothing else.

     'server' — agentBase points at the ai/ app. Keys stay server-side and the
       outward-looking tools work.
     'direct' — no server. The widget calls Groq itself and reads Postgres
       through the staff session the admin password already opened. Runs on a
       phone with nothing installed; reads this restaurant's own numbers only.

     A filled agentBase wins, so moving to a server later is one line. */
  mode() {
    if (this.base()) return 'server';
    return this.groqKey() ? 'direct' : 'none';
  }
  groqKey() { return this.props.groqKey ?? this.cfg().groqKey ?? ''; }
  geminiKey() { return this.props.geminiKey ?? this.cfg().geminiKey ?? ''; }

  /* The app's own authenticated client, handed down by whichever screen mounted
     this. Not reached through a global: the counter keeps its client on the
     component and the guest app keeps it on db.remote, so each host passes what
     it has. */
  sb() { return this.props.sb || null; }
  rid() { return this.props.rid || ''; }

  /* Resolved against the page, not against whatever script is evaluating this
     class — a bare './ai-direct.js' specifier resolves relative to the runtime
     module and silently fails to load. */
  async mod() {
    if (!this._mod) {
      const url = new URL('./ai-direct.js', document.baseURI).href;
      this._mod = await import(url);
    }
    return this._mod;
  }

  scope() { return this.props.scope === 'counter' ? 'counter' : 'admin'; }
  skin() { return SKIN[this.scope()]; }

  // Who a dictated ticket is credited to. The counter already signs staff in
  // against a PIN, so the shared tablet has a name to stamp; without one the
  // ticket says so rather than claiming nobody made it.
  staff() { return this.props.staff ?? this.cfg().staffName ?? ''; }

  componentDidMount() { this._mounted = true; }
  componentWillUnmount() {
    this._mounted = false;
    this.stopRec();
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }

  scrollLog() {
    const el = this._log;
    if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }

  push(role, text) {
    this.setState(s => ({ log: s.log.concat([{ role, text }]) }));
    this.scrollLog();
  }

  patchLast(text) {
    this.setState(s => {
      const log = s.log.slice();
      if (log.length) log[log.length - 1] = { role: 'agent', text };
      return { log };
    });
    this.scrollLog();
  }

  // ---- the agent ----

  // One retry against ?small=1. The 120B's free allowance runs out before the
  // 20B's does, and a stream cannot be re-routed once it has started — so the
  // step-down is a second request, and the next question tries the 120B again.
  async ask(text) {
    if (!text.trim() || this.state.busy) return;

    const mode = this.mode();
    if (mode === 'none') {
      this.push('you', text);
      this.setState({
        note: 'The assistant has nothing to talk to yet. Fill in agentBase or groqKey in config.js.',
      });
      return;
    }

    this.push('you', text);
    this.push('agent', '');
    this.setState({ busy: true, draft: '', phase: 'thinking', note: '', kot: null });

    const msgs = this.state.log
      .filter(m => m.text)
      .map(m => ({ role: m.role === 'you' ? 'user' : 'assistant', content: m.text }))
      .concat([{ role: 'user', content: text }]);

    let reply = '';
    if (mode === 'direct') {
      reply = await this.askDirect(msgs);
    } else {
      const body = JSON.stringify({ messages: msgs });
      try {
        reply = await this.stream(body, false);
      } catch (e) {
        try {
          this.setState({ engine: '8b' });
          reply = await this.stream(body, true);
        } catch (e2) {
          this.patchLast('');
          this.setState({ note: 'The assistant is unreachable. ' + String(e2.message || e2) });
        }
      }
    }

    this.setState({ busy: false, phase: '' });
    if (reply) this.takeKot(reply);
    return reply;
  }

  /* No server: the loop runs here. It cannot stream, because each step needs
     the whole reply before it knows whether a tool was called — so the status
     line names the tool being read instead, which is more use than a cursor. */
  async askDirect(messages) {
    const sb = this.sb();
    if (!sb) {
      this.patchLast('');
      this.setState({
        note: 'Not signed in to the server yet. Sign in to the admin panel, then ask again.',
      });
      return '';
    }

    try {
      const { runDirect, systemPrompt } = await this.mod();
      const reply = await runDirect({
        key: this.groqKey(),
        geminiKey: this.geminiKey(),
        sb,
        rid: this.rid(),
        system: systemPrompt({ scope: this.scope(), tables: this.props.tables }),
        messages,
        onPhase: p => { if (this._mounted) this.setState({ phase: p }); },
      });
      this.patchLast(this.visible(reply));
      return reply;
    } catch (e) {
      this.patchLast('');
      const msg = String((e && e.message) || e);
      this.setState({
        note: /401|invalid api key/i.test(msg)
          ? 'Groq refused the key. Check groqKey in config.js.'
          : 'That did not go through. ' + msg,
      });
      return '';
    }
  }

  async stream(body, small) {
    const url = this.base() + '/agent?plain=1' + (small ? '&small=1' : '');
    const res = await fetch(url, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body,
    });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let out = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      out += dec.decode(value, { stream: true });
      if (!this._mounted) break;
      this.patchLast(this.visible(out));
      if (this.state.phase) this.setState({ phase: '' });
    }
    return out;
  }

  // The kot block is machinery, not conversation — strip it from the bubble.
  visible(t) { return t.replace(/```kot[\s\S]*$/, '').trim(); }

  takeKot(raw) {
    const m = raw.match(/```kot\s*([\s\S]*?)```/);
    if (!m) return;
    try {
      const k = JSON.parse(m[1]);
      const items = (k.items || []).filter(i => i && i.name);
      if (items.length) this.setState({ kot: { table: k.table || '', items } });
    } catch (e) {
      // A malformed block is a misheard order, so it must not become a silent
      // no-op: staff are told to type it rather than left waiting.
      this.setState({ note: 'Could not read that order back. Please enter it on the order screen.' });
    }
  }

  // ---- voice ----

  async micDown() {
    if (this.state.busy || this.state.rec) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm', 'audio/mp4'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      const rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      const chunks = [];
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        if (chunks.length) this.heard(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
      };
      this._rec = rec;
      rec.start();
      this.setState({ rec: true, note: '' });
    } catch (e) {
      this.setState({ note: 'No microphone access. Type instead.' });
    }
  }

  micUp() { this.stopRec(); }

  stopRec() {
    const r = this._rec;
    this._rec = null;
    if (r && r.state !== 'inactive') { try { r.stop(); } catch (e) {} }
    if (this.state.rec) this.setState({ rec: false });
  }

  async heard(blob) {
    this.setState({ busy: true, phase: 'listening' });
    try {
      let english = '';
      let via = '';

      if (this.mode() === 'direct') {
        // Gemini hears it when its key is set — it reads Indian accents better
        // and reports which language was spoken. Whisper on the Groq key is
        // the fallback, and cannot say what it heard.
        const { hear } = await this.mod();
        const h = await hear(this.groqKey(), blob, this.geminiKey());
        english = h.text;
        via = h.via === 'whisper' ? 'whisper' : '';
        if (h.lang && h.lang !== 'und') this._heardLang = h.lang;
      } else {
        const b64 = await this.b64(blob);
        const res = await fetch(this.base() + '/voice', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ audio: b64, mime: blob.type }),
        });
        const d = await res.json();
        if (!res.ok || !d.english) throw new Error(d.error || 'nothing heard');
        english = d.english;
        via = d.via === 'whisper' ? 'whisper' : '';
        if (d.lang && d.lang !== 'und') this._heardLang = d.lang;
      }

      if (!english) throw new Error('nothing heard');

      // The ear reports the language when it can; Whisper cannot, and then the
      // button's own setting is what the answer comes back in.
      const lang = this._heardLang || this.state.lang;
      this._heardLang = null;
      this.setState({ busy: false, phase: '', engine: via });

      const reply = await this.ask(english);
      if (reply) this.say(this.visible(reply), lang);
    } catch (e) {
      this.setState({ busy: false, phase: '', note: 'Could not hear that. ' + String(e.message || e) });
    }
  }

  b64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  async say(text, lang) {
    if (!text || !window.speechSynthesis) return;
    let spoken = text;
    if (lang && lang !== 'en') {
      try {
        if (this.mode() === 'direct') {
          const { intoLanguage } = await this.mod();
          spoken = await intoLanguage(this.groqKey(), text, lang, this.geminiKey());
        } else {
          const res = await fetch(this.base() + '/voice', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text, lang }),
          });
          const d = await res.json();
          if (d.spoken) spoken = d.spoken;
        }
      } catch (e) { /* English aloud beats silence */ }
    }
    try {
      const u = new SpeechSynthesisUtterance(spoken);
      u.lang = { ta: 'ta-IN', te: 'te-IN', en: 'en-IN' }[lang] || 'en-IN';
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---- kot handoff ----
  //
  // This component does not own the order store, so it hands the confirmed
  // ticket to whoever mounted it and says plainly when nobody is listening.
  fireKot() {
    const k = this.state.kot;
    if (!k) return;
    const ticket = { ...k, staff: this.staff(), dictated: true, at: Date.now() };
    if (typeof this.props.onKot === 'function') {
      this.props.onKot(ticket);
      this.setState({ kot: null, note: '' });
      this.push('agent', 'Sent to the order screen.');
    } else {
      this.setState({ kot: null, note: 'Not connected to the order screen yet — enter it there.' });
    }
  }

  renderVals() {
    const st = this.state;
    const scope = this.scope();
    const c = this.skin();
    const kot = st.kot;

    const ROLE = {
      you: { align: 'flex-end', who: 'You', ink: c.ink, bg: c.mine, edge: c.mineEdge, label: c.dim },
      agent: { align: 'flex-start', who: 'Assistant', ink: c.body, bg: c.theirs, edge: c.theirsEdge, label: c.dim },
    };

    /* Seeds have to be honest about the mode. Without a server there is no
       heavy reasoner and no outside world, so a prompt offering a whole-menu
       margin calculation would tee up a refusal. */
    const direct = this.mode() === 'direct';
    const SEEDS = scope === 'counter'
      ? ['Which dishes are slow or badly rated?', 'Table 7 wants two chicken biryani, less spicy', 'Which dishes ran out today?']
      : direct
        ? ['Which dishes are slow or badly rated?', 'How did the week trade?', 'Where is the kitchen losing time?']
        : ['How did the week trade?', 'Which dishes are rated badly but selling?', 'Work out the margin across the whole menu this month'];

    return {
      c,
      closed: !st.open,
      shown: st.open,
      unread: st.unread,
      open: () => this.setState({ open: true, unread: false }),
      close: () => { this.stopRec(); try { window.speechSynthesis.cancel(); } catch (e) {} this.setState({ open: false }); },

      scopeLabel: scope === 'counter' ? "Sulthan's · Counter" : "Sulthan's · Service desk",
      engine: st.engine === 'whisper' ? 'whisper' : '8B',
      engineShown: !!st.engine,

      log: st.log.filter(m => m.text).map(m => ({ ...ROLE[m.role], text: m.text })),
      empty: !st.log.some(m => m.text),
      prompts: SEEDS.map(text => ({ text, go: () => this.ask(text) })),

      thinking: st.busy,
      thinkingLabel: PHASE[st.phase] || (st.phase ? 'Reading the numbers' : 'Working'),

      logRef: el => { this._log = el; },
      inputRef: el => { this._input = el; },
      draft: st.draft,
      placeholder: scope === 'counter' ? 'Ask, or dictate an order' : 'Ask about the business',
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.ask(st.draft); }
      },
      send: () => this.ask(st.draft),

      micDown: () => this.micDown(),
      micUp: () => this.micUp(),
      micEdge: st.rec ? c.tintEdge : c.fieldEdge,
      micBg: st.rec ? c.tint : 'rgba(0,0,0,.35)',
      micInk: st.rec ? c.acc : c.mut,
      micAnim: st.rec ? c.ring : 'none',

      langShown: !st.log.length || st.rec,
      langs: [['ta', 'Tamil'], ['te', 'Telugu'], ['en', 'English']].map(([k, label]) => ({
        label,
        edge: st.lang === k ? c.tintEdge : c.edgeSoft,
        bg: st.lang === k ? c.tint : 'transparent',
        ink: st.lang === k ? c.ink : c.mut,
        go: () => this.setState({ lang: k }),
      })),

      hasKot: !!kot,
      kotTable: kot ? (kot.table ? 'Table ' + kot.table : 'No table given') : '',
      kotItems: kot
        ? kot.items.map(i => ({
            qty: i.qty || 1,
            name: i.name,
            note: i.note || '',
            hasNote: !!i.note,
          }))
        : [],
      // Voice mishears a dish name eventually, and the confirm card is the only
      // thing standing between that and the kitchen.
      kotUnmatched: !!(kot && !kot.table),
      kotWarn: 'No table number was heard. Check it before sending.',
      kotBy: this.staff() ? 'Dictated · ' + this.staff() : 'Dictated · no staff signed in',
      kotConfirm: () => this.fireKot(),
      kotDiscard: () => this.setState({ kot: null }),

      hasNote: !!st.note,
      note: st.note,
    };
  }
}
</script>
</body>
</html>
